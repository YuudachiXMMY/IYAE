spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:iyae}?useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:iyae}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

app:
  jwt:
    secret: ${JWT_SECRET:}
    expiration-ms: 86400000
  ai:
    provider: ${AI_PROVIDER:mock}
    claude:
      api-key: ${ANTHROPIC_API_KEY:}
    deepseek:
      api-key: ${DEEPSEEK_API_KEY:}
    minimax:
      api-key: ${MINIMAX_API_KEY:}
  brand:
    domain: ${BRAND_DOMAIN:iyae.ca}
    service-id: ${BRAND_SERVICE_ID:iyae-server}
    guest-email: ${BRAND_GUEST_EMAIL:guest@iyae.internal}
  cors:
    origins: ${CORS_ORIGINS:http://localhost:3000,http://localhost:3001,http://iyae.localhost}
  frontend:
    base-url: ${FRONTEND_BASE_URL:http://localhost:3000}
  mail:
    resend-endpoint: ${RESEND_MAIL_ENDPOINT:}
    internal-secret: ${INTERNAL_MAIL_SECRET:}
  auth:
    verification-token-ttl: 24h
    password-reset-ttl: 1h
    require-email-verification: true
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    # Comma-separated IPs and/or CIDR ranges whose X-Forwarded-For is trusted.
    # Empty by default (uses remoteAddr); set to the Nginx/proxy subnet in prod.
    trusted-proxies: ${RATE_LIMIT_TRUSTED_PROXIES:}
