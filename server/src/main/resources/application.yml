spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:iyae}?useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:iyae}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      # Align the servlet cap with FileStorageService's 10 MB code limit. Spring's 1 MB default
      # otherwise rejects 2–8 MB photo uploads before they reach the service (→ handled as 413).
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 8080

app:
  jwt:
    secret: ${JWT_SECRET:}
    expiration-ms: 86400000
  ai:
    provider: ${AI_PROVIDER:mock}
    claude:
      api-key: ${ANTHROPIC_API_KEY:}
    deepseek:
      api-key: ${DEEPSEEK_API_KEY:}
    minimax:
      api-key: ${MINIMAX_API_KEY:}
  weather:
    enabled: ${WEATHER_ENABLED:true}
    api-url: ${WEATHER_API_URL:https://api.open-meteo.com/v1/forecast}
    latitude: ${WEATHER_LATITUDE:43.6532}
    longitude: ${WEATHER_LONGITUDE:-79.3832}
    timezone: ${WEATHER_TIMEZONE:America/Toronto}
    cache-ttl-seconds: ${WEATHER_CACHE_TTL:1800}
  brand:
    domain: ${BRAND_DOMAIN:iyae.ca}
    service-id: ${BRAND_SERVICE_ID:iyae-server}
    guest-email: ${BRAND_GUEST_EMAIL:guest@iyae.internal}
  cors:
    origins: ${CORS_ORIGINS:http://localhost:3000,http://localhost:3001,http://iyae.localhost}
  frontend:
    base-url: ${FRONTEND_BASE_URL:http://localhost:3000}
  mail:
    internal-endpoint: ${INTERNAL_MAIL_ENDPOINT:}
    internal-secret: ${INTERNAL_MAIL_SECRET:}
  auth:
    verification-token-ttl: 24h
    password-reset-ttl: 1h
    require-email-verification: true
  admin:
    # Creates or promotes exactly one ADMIN on boot, then no-ops. Required in production:
    # DataSeeder (the only other source of an ADMIN row) does not run there, public
    # registration rejects the role, and no migration inserts one — so without this the
    # moderation surface is live but unreachable. See AdminBootstrap.
    bootstrap-email: ${ADMIN_BOOTSTRAP_EMAIL:}
    bootstrap-password: ${ADMIN_BOOTSTRAP_PASSWORD:}
  catalog:
    # Path to a JSON manifest of starter listings, created on boot under the operator account
    # from app.admin.bootstrap-email and skipped by name if already present. Blank seeds
    # nothing. Flyway inserts no content and DataSeeder does not run in production, so without
    # this (or a hand-entered catalogue) a fresh instance serves an empty storefront.
    # See CatalogSeeder and deploy/catalog-seed.example.json.
    seed-manifest: ${CATALOG_SEED_MANIFEST:}
  payments:
    # The free-order dev stub. OFF everywhere except dev/test: a blank STRIPE_SECRET_KEY must
    # make checkout answer 503, not write the order PAID without collecting payment.
    # Deliberately NOT env-overridable — re-enabling payment is a code+config change, not a flag.
    stub-checkout-enabled: false
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    # Comma-separated IPs and/or CIDR ranges whose X-Forwarded-For is trusted.
    # Empty by default (uses remoteAddr); set to the Nginx/proxy subnet in prod.
    trusted-proxies: ${RATE_LIMIT_TRUSTED_PROXIES:}
  analytics:
    enabled: ${ANALYTICS_ENABLED:true}
    # Experiment cohorts users are deterministically bucketed into (defaults to control,variant).
    cohorts: ${ANALYTICS_COHORTS:control,variant}
    # Phase 1-3 垂坠改动的部署时间戳(ISO-8601 instant),作为 /api/admin/kpis/drape-decision
    # 前后对比的默认切分点。留空则该端点须显式传 ?cutoff=。
    drape-deploy-cutoff: ${ANALYTICS_DRAPE_DEPLOY_CUTOFF:}
