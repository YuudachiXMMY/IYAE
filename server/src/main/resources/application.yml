spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:clossette}?useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:clossette}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  mail:
    host: ${SPRING_MAIL_HOST:localhost}
    port: ${SPRING_MAIL_PORT:1025}
    properties:
      mail:
        smtp:
          timeout: 5000

server:
  port: 8080

app:
  jwt:
    secret: ${JWT_SECRET:}
    expiration-ms: 86400000
  ai:
    provider: ${AI_PROVIDER:mock}
    claude:
      api-key: ${ANTHROPIC_API_KEY:}
    deepseek:
      api-key: ${DEEPSEEK_API_KEY:}
    minimax:
      api-key: ${MINIMAX_API_KEY:}
  cors:
    origins: ${CORS_ORIGINS:http://localhost:3000,http://localhost:3001,http://clossette.localhost}
  frontend:
    base-url: ${FRONTEND_BASE_URL:http://localhost:3000}
  mail:
    from: ${MAIL_FROM:noreply@clossette.com}
    resend-endpoint: ${RESEND_MAIL_ENDPOINT:}
    internal-secret: ${INTERNAL_MAIL_SECRET:}
  auth:
    verification-token-ttl: 24h
    password-reset-ttl: 1h
    require-email-verification: true
