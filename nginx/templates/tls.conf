# TLS-enabled site config.
#
# This is a TEMPLATE. `prod_deploy.sh ssl-init <domain>` substitutes __SERVER_NAME__ and
# __CERT_NAME__ and installs the result as nginx/conf.d/default.conf, replacing the HTTP-only
# config. It is a file swap rather than a block you uncomment, because the previous design —
# "obtain certs, then hand-edit two commented regions" — shipped to production with TLS off and
# nobody noticed. Passwords and JWTs crossed the internet in cleartext.
#
# nginx cannot start with an ssl_certificate path that does not exist, which is why this cannot
# simply be enabled by default: the swap has to happen after issuance.

upstream web {
    server web:3000;
}

upstream api {
    server server:8080;
}

# Port 80 exists only to answer ACME challenges and to redirect everything else.
server {
    listen 80;
    server_name __SERVER_NAME__;

    # MUST stay reachable over plain HTTP for renewals; ACME http-01 does not follow to HTTPS
    # for the challenge itself.
    location /.well-known/acme-challenge/ {
        root /var/certbot/www;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name __SERVER_NAME__;

    ssl_certificate     /etc/letsencrypt/live/__CERT_NAME__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__CERT_NAME__/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    # Two years, preload-eligible. Only safe because port 80 now redirects.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /.well-known/acme-challenge/ {
        root /var/certbot/www;
    }

    location /api/ {
        proxy_pass         http://api;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        alias /var/iyae/assets/uploads/;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # Avatar body meshes are served through the API, which authenticates them. Only the
    # non-personal asset subtrees are exposed as static files here. This is an allow-list, so it
    # must name every subtree a worker provider writes to — products/ and rigged/ included, or
    # every generated preview and rigged garment 404s. Keep in step with conf.d/default.conf,
    # WebMvcConfig and SecurityConfig; SecurityConfigAssetExposureTest pins all four together.
    location /assets/models/ {
        alias /var/iyae/assets/models/;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    location /assets/poses/ {
        alias /var/iyae/assets/poses/;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    location /assets/garments/ {
        alias /var/iyae/assets/garments/;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    location /assets/products/ {
        alias /var/iyae/assets/products/;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    location /assets/rigged/ {
        alias /var/iyae/assets/rigged/;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # Everything else under /assets/ — notably /assets/avatars/{userId}/ — is personal data and
    # must not be served unauthenticated. See the API's authenticated avatar delivery route.
    location /assets/ {
        return 404;
    }

    location /_next/static {
        proxy_pass http://web;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass         http://web;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
    }
}
