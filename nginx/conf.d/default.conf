# HTTP-only site config — the pre-certificate state ONLY.
#
# Do not ship a public deployment on this file. `prod_deploy.sh up` refuses to start unless
# either this file has been replaced by the TLS config or ALLOW_INSECURE_HTTP=true is set
# explicitly, because the previous arrangement (a commented-out HTTPS block plus a commented-out
# redirect, both needing a hand edit) reached production with TLS off: every password and JWT
# crossed the internet in cleartext.
#
# To enable TLS:  ./prod_deploy.sh ssl-init <your-domain>
# That obtains the certificate and installs nginx/templates/tls.conf over this file.

upstream web {
    server web:3000;
}

upstream api {
    server server:8080;
}

server {
    listen 80;
    server_name _;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /.well-known/acme-challenge/ {
        root /var/certbot/www;
    }

    location /api/ {
        proxy_pass         http://api;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        alias /var/iyae/assets/uploads/;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # Only the non-personal asset subtrees are served as static files. `/assets/` used to be a
    # blanket alias, which made every user's generated body mesh at
    # /assets/avatars/{userId}/avatar.glb downloadable by anyone who could count — no
    # authentication, sequential integer path, body measurements included.
    #
    # This list is an allow-list, so every subtree a worker provider actually writes to has to
    # appear here or the asset 404s. The authoritative set of producers:
    #   products/ — {stub,tripo,meshy}_generator.py  -> glb_url, usdz_url
    #   rigged/   — {python,blender,stub}_rigging_provider.py -> rigged_glb_url
    #   models/, poses/, garments/ — static seed assets (GlbAssetInitializer)
    #   avatars/  — DELIBERATELY ABSENT. Body scans are personal data and are served only by
    #               GET /api/avatar/model, which resolves the file from the authenticated principal.
    # SecurityConfigAssetExposureTest asserts this list against WebMvcConfig and SecurityConfig,
    # so a subtree added in one layer and forgotten in another fails the build.
    location /assets/models/ {
        alias /var/iyae/assets/models/;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    location /assets/poses/ {
        alias /var/iyae/assets/poses/;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    location /assets/garments/ {
        alias /var/iyae/assets/garments/;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # Generated product previews: /assets/products/{productId}/tasks/{taskId}/preview.{glb,usdz}.
    # Returned raw to the browser by GenerationService.getStatus() and rendered by <model-viewer>,
    # so there is no API route that could serve these instead.
    location /assets/products/ {
        alias /var/iyae/assets/products/;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # Rigged garments: /assets/rigged/{garmentAssetId}/garment-rigged.glb, stored on GarmentAsset
    # and rendered directly by the try-on viewer. The Blender provider's job.json/result.json —
    # which contain absolute container paths and the avatar URL, hence the owning user id — are
    # written under /assets/rigging-work/ instead, which this allow-list does not cover.
    location /assets/rigged/ {
        alias /var/iyae/assets/rigged/;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # Anything else under /assets/ is personal data; it is reachable only through the
    # authenticated API route, never as a static file.
    location /assets/ {
        return 404;
    }

    location /_next/static {
        proxy_pass http://web;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass         http://web;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
    }
}
