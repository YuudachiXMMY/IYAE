services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: iyae
      MYSQL_USER: iyae
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT:-3002}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "${API_PORT:-3001}:8080"
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: iyae
      DB_USERNAME: iyae
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      # Mirrors docker-compose.prod.yml so the catalogue-seeding path can be exercised in dev
      # rather than first encountered on a production cutover. Unset = seed nothing.
      #
      # The admin variables take a DEV_-prefixed name on purpose, so that copying a production
      # .env into a dev stack cannot set them by accident. Read this before you set them:
      #
      #   AdminBootstrap is @Order(0) and DataSeeder is @Order(2), and DataSeeder skips entirely
      #   when `users.count() > 0`. So on a FRESH dev database, setting DEV_ADMIN_BOOTSTRAP_EMAIL
      #   makes AdminBootstrap create its one admin first, DataSeeder then find a user already
      #   present, and seed NOTHING — no designers, no buyers, no 36 products, no promotions.
      #   Nothing errors; you just get an empty dev environment and an E2E suite that fails at
      #   sign-in. This is 100% reproducible, not a race.
      #
      #   CatalogSeeder needs the operator email to resolve whose profile owns the listings, so
      #   trying the manifest in dev is a TWO-STEP job: boot once with these unset to let
      #   DataSeeder populate the database, then set them and restart. `./dev.sh reset` wipes the
      #   volumes and puts you back at step one.
      #
      # Not fixed by changing DataSeeder's guard, deliberately: the obvious narrowing
      # (`count() > countByRole(ADMIN)`) makes DataSeeder run *after* AdminBootstrap has created
      # an admin, and DataSeeder then inserts its own `admin@${BRAND_DOMAIN}` — which collides on
      # the unique email the moment the two addresses match, trading a silent empty database for
      # a startup exception. The guard also backs CI's readiness probe. Documented instead.
      CATALOG_SEED_MANIFEST: ${CATALOG_SEED_MANIFEST:-}
      ADMIN_BOOTSTRAP_EMAIL: ${DEV_ADMIN_BOOTSTRAP_EMAIL:-}
      ADMIN_BOOTSTRAP_PASSWORD: ${DEV_ADMIN_BOOTSTRAP_PASSWORD:-}
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      MINIMAX_API_KEY: ${MINIMAX_API_KEY:-}
      # The actual web origin is always appended: browsers attach `Origin` to
      # every POST/PUT/DELETE (even same-origin), the Next.js rewrite forwards
      # it, and Spring rejects anything unlisted. With WEB_PORT != 3000 that
      # turns every write — login, add-to-cart, checkout — into a 403.
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:3001,http://iyae.localhost},http://localhost:${WEB_PORT:-3000}
      AVATAR_GENERATION_PROVIDER: ${AVATAR_GENERATION_PROVIDER:-mock}
      JAVA_TOOL_OPTIONS: "-Xmx384m -Xms128m"
      RESEND_MAIL_ENDPOINT: http://web:3000/api/internal/mail/send
      INTERNAL_MAIL_SECRET: ${INTERNAL_MAIL_SECRET:-dev-internal-secret}
    volumes:
      - assets_data:/var/iyae/assets
      # Mirrors docker-compose.prod.yml, so CATALOG_SEED_MANIFEST takes the same container path
      # in both and the manifest can be tried in dev before a cutover depends on it.
      - ./deploy:/etc/iyae/deploy:ro
    depends_on:
      mysql:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.iyae-api.rule=Host(`${API_DOMAIN:-api.iyae.localhost}`)"
      - "traefik.http.services.iyae-api.loadbalancer.server.port=8080"
    networks:
      - iyae-net
      - proxy
      - default

  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: iyae
      DB_USERNAME: iyae
      DB_PASSWORD: ${DB_PASSWORD}
      MODEL_GENERATION_PROVIDER: ${MODEL_GENERATION_PROVIDER:-mock}
      AVATAR_GENERATION_PROVIDER: ${AVATAR_GENERATION_PROVIDER:-mock}
      WORKER_TRIPO_API_KEY: ${WORKER_TRIPO_API_KEY:-}
      WORKER_MESHY_API_KEY: ${WORKER_MESHY_API_KEY:-}
      WORKER_POLL_INTERVAL: ${WORKER_POLL_INTERVAL:-5}
      WORKER_OUTPUT_DIR: /var/iyae/assets
      # Model and avatar tasks only. `dev.sh start`/`restart` always pass `--profile rigging`, so
      # the dedicated rigging-worker (RIGGING_PROVIDER=python) is always up in dev — and leaving
      # this container at the ALL_ROLES default made it a second claimant for the same queue.
      # Whichever won the race decided whether a garment was rigged for real or with this
      # container's RIGGING_PROVIDER=mock stub output, and both wrote the same
      # /assets/rigged/{id} path. Giving rigging-worker `WORKER_ROLES: rigging` only fixed one
      # direction; the two are now disjoint in both. Production differs on purpose: it runs a
      # single worker off Dockerfile.rigging with every role and real providers.
      WORKER_ROLES: ${WORKER_ROLES:-model,avatar}
      RIGGING_PROVIDER: ${RIGGING_PROVIDER:-mock}
      SMPLX_MODELS_PATH: /var/iyae/smplx_models
    volumes:
      - assets_data:/var/iyae/assets
      - ${SMPLX_MODELS_PATH:-./smplx_models}:/var/iyae/smplx_models:ro
    depends_on:
      mysql:
        condition: service_healthy

  rigging-worker:
    build:
      context: ./worker
      dockerfile: Dockerfile.rigging
    environment:
      # Claim ONLY rigging tasks. This container runs the same main.py, so without the
      # role switch it became a second claimant for model and avatar tasks — and with
      # MODEL_GENERATION_PROVIDER unset (mock) it would complete real generation requests
      # with stub output whenever it won the race.
      WORKER_ROLES: rigging
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: iyae
      DB_USERNAME: iyae
      DB_PASSWORD: ${DB_PASSWORD}
      WORKER_POLL_INTERVAL: ${WORKER_POLL_INTERVAL:-5}
      WORKER_OUTPUT_DIR: /var/iyae/assets
      RIGGING_PROVIDER: ${RIGGING_PROVIDER:-python}
      SMPLX_MODELS_PATH: /var/iyae/smplx_models
    volumes:
      - assets_data:/var/iyae/assets
      - ${SMPLX_MODELS_PATH:-./smplx_models}:/var/iyae/smplx_models:ro
    depends_on:
      mysql:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '2.0'
    restart: unless-stopped
    profiles:
      - rigging

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        API_PROXY_TARGET: http://server:8080
    ports:
      - "${WEB_PORT:-3000}:3000"
    environment:
      INTERNAL_MAIL_SECRET: ${INTERNAL_MAIL_SECRET:-dev-internal-secret}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      MAIL_FROM: ${RESEND_FROM_EMAIL:-onboarding@resend.dev}
    depends_on:
      - server
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.iyae-web.rule=Host(`${WEB_DOMAIN:-iyae.localhost}`)"
      - "traefik.http.services.iyae-web.loadbalancer.server.port=3000"
    networks:
      - iyae-net
      - proxy
      - default

networks:
  iyae-net:
    driver: bridge
  proxy:
    external: true

volumes:
  mysql_data:
  assets_data:
