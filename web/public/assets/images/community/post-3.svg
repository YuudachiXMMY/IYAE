  <circle cx="200" cy="280" r="5" fill="#c8b8a0" fill-opacity="0.5"/>
  <circle cx="240" cy="280" r="5" fill="#c8b8a0" fill-opacity="0.5"/>
  <circle cx="280" cy="280" r="5" fill="#c8b8a0" fill-opacity="0.5"/>
