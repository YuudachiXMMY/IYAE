services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: clossette
      MYSQL_USER: clossette
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - clossette-net

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: clossette
      DB_USERNAME: clossette
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      MINIMAX_API_KEY: ${MINIMAX_API_KEY:-}
      AVATAR_GENERATION_PROVIDER: ${AVATAR_GENERATION_PROVIDER:-mock}
      CORS_ORIGINS: ${CORS_ORIGINS}
      SPRING_PROFILES_ACTIVE: prod
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost:3000}
      MAIL_FROM: ${MAIL_FROM:-noreply@clossette.ca}
      RESEND_MAIL_ENDPOINT: http://web:3000/api/internal/mail/send
      INTERNAL_MAIL_SECRET: ${INTERNAL_MAIL_SECRET}
    volumes:
      - assets_data:/var/clossette/assets
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - clossette-net

  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile.rigging
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: clossette
      DB_USERNAME: clossette
      DB_PASSWORD: ${DB_PASSWORD}
      MODEL_GENERATION_PROVIDER: ${MODEL_GENERATION_PROVIDER:-mock}
      AVATAR_GENERATION_PROVIDER: ${AVATAR_GENERATION_PROVIDER:-mock}
      WORKER_TRIPO_API_KEY: ${WORKER_TRIPO_API_KEY}
      WORKER_MESHY_API_KEY: ${WORKER_MESHY_API_KEY}
      WORKER_POLL_INTERVAL: ${WORKER_POLL_INTERVAL:-5}
      WORKER_OUTPUT_DIR: /var/clossette/assets
      RIGGING_PROVIDER: ${RIGGING_PROVIDER:-python}
      SMPLX_MODELS_PATH: /var/clossette/smplx_models
    volumes:
      - assets_data:/var/clossette/assets
      - ${SMPLX_MODELS_PATH:-./smplx_models}:/var/clossette/smplx_models:ro
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - clossette-net

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        API_PROXY_TARGET: http://server:8080
    environment:
      INTERNAL_MAIL_SECRET: ${INTERNAL_MAIL_SECRET}
      RESEND_API_KEY: ${RESEND_API_KEY}
      MAIL_FROM: ${RESEND_FROM_EMAIL:-onboarding@resend.dev}
    depends_on:
      - server
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - clossette-net

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - assets_data:/var/clossette/assets:ro
      - letsencrypt:/etc/letsencrypt:ro
      - certbot_www:/var/certbot/www
    depends_on:
      - web
      - server
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:80/"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - clossette-net

  certbot:
    image: certbot/certbot
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot_www:/var/certbot/www
    networks:
      - clossette-net
    profiles:
      - tools

networks:
  clossette-net:
    driver: bridge

volumes:
  mysql_data:
  assets_data:
  letsencrypt:
  certbot_www:
