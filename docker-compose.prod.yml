# Shared defaults.
#
# restart: every service previously had NO restart policy, so a single OOM kill, crash or host
# reboot was a permanent outage with no auto-recovery — the audit filed this four times, once
# per service.
#
# logging: no service capped its logs, on the same disk that holds the only copy of the
# database and all uploads. An unbounded log is a slow disk-full outage.
x-service-defaults: &service-defaults
  restart: unless-stopped
  logging:
    driver: "json-file"
    options:
      max-size: "10m"
      max-file: "3"

services:
  mysql:
    <<: *service-defaults
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: iyae
      MYSQL_USER: iyae
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - iyae-net

  server:
    <<: *service-defaults
    build:
      context: ./server
      dockerfile: Dockerfile
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: iyae
      DB_USERNAME: iyae
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      MINIMAX_API_KEY: ${MINIMAX_API_KEY:-}
      AVATAR_GENERATION_PROVIDER: ${AVATAR_GENERATION_PROVIDER:-mock}
      CORS_ORIGINS: ${CORS_ORIGINS}
      SPRING_PROFILES_ACTIVE: prod
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost:3000}
      RESEND_MAIL_ENDPOINT: http://web:3000/api/internal/mail/send
      INTERNAL_MAIL_SECRET: ${INTERNAL_MAIL_SECRET}
      # Without these the deployment has no administrator and cannot get one, so the
      # /admin console and the UGC report queue are live but unreachable.
      ADMIN_BOOTSTRAP_EMAIL: ${ADMIN_BOOTSTRAP_EMAIL}
      ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD}
      # Payment is OFF for launch #1: both blank means POST /api/checkout answers 503.
      # These must be passed through here because no compose file uses env_file:, so without
      # these two lines an operator cannot supply them at all. Supply BOTH or NEITHER —
      # a key without a webhook secret breaks fulfilment instead of enabling payment.
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      # Trust the Nginx reverse proxy's Docker network so per-IP rate limiting keys on the
      # real client via X-Forwarded-For. Default = Docker bridge range; pin to your subnet.
      RATE_LIMIT_TRUSTED_PROXIES: ${RATE_LIMIT_TRUSTED_PROXIES:-172.16.0.0/12}
    volumes:
      - assets_data:/var/iyae/assets
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      # /ready, not /health: /health is a hardcoded 200 that cannot fail, so it would
      # keep a server with an unreachable database in rotation.
      test: ["CMD", "curl", "-sf", "http://localhost:8080/api/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - iyae-net

  worker:
    <<: *service-defaults
    build:
      context: ./worker
      dockerfile: Dockerfile.rigging
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: iyae
      DB_USERNAME: iyae
      DB_PASSWORD: ${DB_PASSWORD}
      MODEL_GENERATION_PROVIDER: ${MODEL_GENERATION_PROVIDER:-mock}
      AVATAR_GENERATION_PROVIDER: ${AVATAR_GENERATION_PROVIDER:-mock}
      WORKER_TRIPO_API_KEY: ${WORKER_TRIPO_API_KEY}
      WORKER_MESHY_API_KEY: ${WORKER_MESHY_API_KEY}
      WORKER_POLL_INTERVAL: ${WORKER_POLL_INTERVAL:-5}
      WORKER_OUTPUT_DIR: /var/iyae/assets
      RIGGING_PROVIDER: ${RIGGING_PROVIDER:-python}
      SMPLX_MODELS_PATH: /var/iyae/smplx_models
    volumes:
      - assets_data:/var/iyae/assets
      - ${SMPLX_MODELS_PATH:-./smplx_models}:/var/iyae/smplx_models:ro
    depends_on:
      mysql:
        condition: service_healthy
    # The worker had no healthcheck at all, so a daemon wedged on a hung provider call looked
    # identical to a working one. It touches a heartbeat file once per poll cycle; this checks
    # the file is fresher than 10 poll intervals, which proves the loop is still turning rather
    # than merely that the process exists.
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os,sys,time; p=os.environ.get('WORKER_HEARTBEAT_PATH','/tmp/worker-heartbeat'); sys.exit(0 if os.path.exists(p) and time.time()-os.path.getmtime(p) < 10*int(os.environ.get('WORKER_POLL_INTERVAL','5')) else 1)\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    networks:
      - iyae-net

  web:
    <<: *service-defaults
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        API_PROXY_TARGET: http://server:8080
    environment:
      INTERNAL_MAIL_SECRET: ${INTERNAL_MAIL_SECRET}
      RESEND_API_KEY: ${RESEND_API_KEY}
      MAIL_FROM: ${RESEND_FROM_EMAIL:-onboarding@resend.dev}
    depends_on:
      - server
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - iyae-net

  nginx:
    <<: *service-defaults
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # A single site file, selected by NGINX_SITE_CONF_FILE, rather than the whole conf.d
      # directory. ssl-init renders the TLS config to a gitignored sibling and records the
      # choice in .env, so enabling TLS is no longer an uncommitted edit to a tracked file
      # that `update`'s `git reset --hard` rollback would silently discard.
      - ./nginx/conf.d/${NGINX_SITE_CONF_FILE:-default.conf}:/etc/nginx/conf.d/default.conf:ro
      - assets_data:/var/iyae/assets:ro
      - letsencrypt:/etc/letsencrypt:ro
      - certbot_www:/var/certbot/www
    depends_on:
      - web
      - server
    # Reload every 6h so a renewed certificate is actually picked up.
    command: /bin/sh -c "while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g 'daemon off;'"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:80/"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - iyae-net

  # Automatic renewal. Previously certbot was a one-shot `tools`-profile container and
  # `ssl-renew` was a fully manual command, so the certificate expired on whatever day nobody
  # remembered — taking the whole site down, since HSTS forbids falling back to HTTP.
  # `certbot renew` is a no-op when nothing is near expiry, and exits 0 when no certs exist.
  certbot:
    <<: *service-defaults
    image: certbot/certbot
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot_www:/var/certbot/www
    networks:
      - iyae-net
    entrypoint: /bin/sh
    command: -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/certbot/www --quiet; sleep 12h & wait $${!}; done'

  # The same certbot image, kept in the tools profile for the one-shot `certonly` that
  # ssl-init runs. Separate from the renewal loop above so the loop is never interrupted.
  certbot-cli:
    image: certbot/certbot
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot_www:/var/certbot/www
    networks:
      - iyae-net
    profiles:
      - tools

networks:
  iyae-net:
    driver: bridge

volumes:
  mysql_data:
  assets_data:
  letsencrypt:
  certbot_www:
