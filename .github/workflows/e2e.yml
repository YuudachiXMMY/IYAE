name: CI

# The Playwright suite is the only gate that exercises the real server, the
# real database and a production web build together. It is also the suite that
# rotted silently — selectors drifted, the auth rate limit turned into
# unrelated-looking failures, and four tests skipped themselves rather than
# fail — because nothing ran it automatically. That is what this workflow is for.
#
# It now also runs the three fast suites that had no CI at all: web unit tests,
# the server's JUnit suite and the worker's pytest suite. They are separate jobs
# so they run in parallel with the E2E job and each other, and so a failure says
# which layer broke. The file is still named e2e.yml for history; the workflow is
# not E2E-only any more.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── The three fast suites ──────────────────────────────────────────────────
  # None of these need a database: the web tests run in jsdom, the server tests
  # run against H2 in memory (src/test/resources/application-test.yml, Flyway
  # off, ddl-auto create-drop) and the worker tests mock MySQL. So they do not
  # pay for the docker-compose bring-up the E2E job needs.

  web-unit:
    name: Web (vitest + tsc + lint + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Typecheck
        working-directory: web
        run: npx tsc --noEmit

      # Errors only — `eslint` exits 0 on warnings, and there are 29 of those
      # (mostly @next/next/no-img-element) that are not worth blocking on. The
      # 53 errors this repo used to carry are fixed, so zero is now the bar.
      - name: Lint
        working-directory: web
        run: npm run lint

      - name: Unit tests
        working-directory: web
        run: npm run test

      # `tsc --noEmit` is not a build. The production build resolves things the
      # typechecker never looks at — `next/font` loaders, the Turbopack import
      # map, CSS — and until now it only happened inside the Playwright job's
      # `docker compose build`. So a `next` upgrade passed this job and then took
      # the E2E job down with "TypeError: fetch failed" in global-setup, because
      # the web image had not built and there was no server to log in to. The
      # real error (a weight ARRAY is invalid for a variable font in 16.4.0) was
      # buried in a Docker build log two steps removed from the failure.
      #
      # Last, because it is the slowest step and the fast signals should land first.
      - name: Production build
        working-directory: web
        run: npm run build

  server-tests:
    name: Server (JUnit)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 22

      # gradle-wrapper.jar is gitignored by the blanket `*.jar` rule, so
      # `./gradlew` does not exist in a fresh checkout — the wrapper script is
      # there but the jar it needs is not. setup-gradle installs the version
      # the wrapper properties pin (8.10) and puts `gradle` on PATH, which is
      # also what server/Dockerfile does with the gradle:8.10-jdk22 image.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Unit tests
        working-directory: server
        run: gradle test --no-daemon

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: server-test-report
          path: server/build/reports/tests/test/
          retention-days: 14

  worker-tests:
    name: Worker (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: worker/requirements.txt

      # torch comes from the CPU-only index first, exactly as worker/Dockerfile
      # does it. requirements.txt lists `torch>=2.0.0` and PyPI's default wheel
      # is the CUDA build — several GB of driver payload for a suite that never
      # touches a GPU. Installing CPU torch first satisfies the constraint, so
      # the requirements pass leaves it alone.
      - name: Install worker dependencies
        working-directory: worker
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      # tests/ is a package (tests/__init__.py), so pytest puts worker/ on
      # sys.path and `providers.*` imports resolve without PYTHONPATH.
      #
      # The SMPL-X real-model test skips here: its weights are licensed and not
      # in the repo. It gates on the weights being present, not on the library
      # being importable — the library is a declared dependency and so is always
      # importable, which is how that test used to fail on every clean checkout.
      - name: Unit tests
        working-directory: worker
        run: pytest -q

  # ── The slow one ───────────────────────────────────────────────────────────

  playwright:
    name: Playwright (chromium)
    runs-on: ubuntu-latest
    # Two image builds (gradle bootJar + next build) plus the suite itself.
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Install Playwright chromium
        working-directory: web
        run: npx playwright install --with-deps chromium

      # The stack is brought up through the project's own docker-compose so CI
      # and `./dev.sh start` cannot drift apart. It also sidesteps a real
      # problem with building the server directly: gradle-wrapper.jar is
      # gitignored (`*.jar`), so `./gradlew` does not exist in a fresh
      # checkout — server/Dockerfile uses the gradle:8.10-jdk22 image instead.
      - name: Write .env for docker compose
        run: |
          cat > .env <<EOF
          MYSQL_ROOT_PASSWORD=ci-root-password
          DB_PASSWORD=ci-app-password
          JWT_SECRET=$(openssl rand -hex 32)
          SPRING_PROFILES_ACTIVE=dev
          AI_PROVIDER=mock
          WEB_PORT=3000
          API_PORT=3001
          DB_PORT=3002
          EOF

      # docker-compose declares `proxy` as an external network (Traefik in the
      # author's local setup). It does not exist on a runner.
      - name: Create the external proxy network
        run: docker network create proxy

      # Only the three services the suite needs. The 3D/rigging workers add
      # several minutes of build time and nothing the E2E tests assert on.
      - name: Start mysql, server and web
        run: docker compose up -d --build mysql server web

      - name: Wait for the API
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3001/api/health >/dev/null 2>&1; then
              echo "API up after ${i} tries"
              exit 0
            fi
            sleep 5
          done
          echo "API never became healthy"
          exit 1

      # DataSeeder (@Profile("!prod")) populates the catalogue and the seed
      # accounts e2e/seed-users.ts expects. /api/health answers before that
      # finishes, so wait for actual seeded data rather than liveness. This
      # deliberately avoids polling the login endpoint, which is rate-limited
      # to five requests per minute per IP.
      - name: Wait for seeded data
        run: |
          for i in $(seq 1 60); do
            count=$(curl -fsS 'http://localhost:3001/api/products?page=0&size=1' \
              | grep -o '"totalElements":[0-9]*' | cut -d: -f2 || echo 0)
            if [ "${count:-0}" -gt 0 ]; then
              echo "catalogue seeded (${count} products)"
              exit 0
            fi
            sleep 5
          done
          echo "DataSeeder never populated the catalogue"
          exit 1

      - name: Wait for the web app
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3000/login >/dev/null 2>&1; then
              echo "web up after ${i} tries"
              exit 0
            fi
            sleep 5
          done
          echo "web never became reachable"
          exit 1

      # Two phases against the one stack, because the halves want different
      # concurrency. Measured against a production build: 14m16s as a single
      # one-worker run (button-smoke alone was 13.2m of it) versus ~6m split.
      #
      # CI is set by Actions, so playwright.config.ts applies workers: 1 and
      # retries: 1. One worker is load-bearing here: these specs mutate state
      # the seed accounts share (the shopper's single server-side cart, follow
      # edges), so concurrent runs delete each other's fixtures.
      - name: Run Playwright — regression
        working-directory: web
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000
          PLAYWRIGHT_API_URL: http://localhost:3001
          # Distinct folders: the two phases are separate runs and would
          # otherwise overwrite each other's report and traces.
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/regression
        run: npx playwright test --project=regression --output=test-results/regression

      # The audit shares no fixture and re-navigates before every click, so it
      # parallelises. Two workers rather than three: a runner has far fewer
      # cores than a dev machine, and this spec's original failure mode was
      # click timeouts under worker contention. The longer click timeout is
      # there for the same reason.
      - name: Run Playwright — button audit
        working-directory: web
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000
          PLAYWRIGHT_API_URL: http://localhost:3001
          PLAYWRIGHT_CLICK_TIMEOUT: 30000
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/audit
        # Runs even when the regression phase failed: a dead button is worth
        # knowing about in the same run as whatever else broke.
        if: ${{ !cancelled() }}
        run: npx playwright test --project=audit --workers=2 --output=test-results/audit

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 14

      # error-context.md snapshots and traces for the failing tests.
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: web/test-results/
          retention-days: 14

      # A Playwright failure is often a server-side failure. Without these the
      # report shows a timeout and nothing about why.
      - name: Dump service logs
        if: failure()
        run: docker compose logs --no-color --tail 400 mysql server web

      - name: Tear down
        if: ${{ !cancelled() }}
        run: docker compose down -v
